<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Modal</title>
    <script src = "https://cdn.tailwindcss.com"></script>
</head>
<body>
<!--    Global container-->
    <div class="flex items-center justify-center min-h-screen bg-slate-100">
        <div class = "flex flex-col p-6 m-3 space-y-10 bg-white rounded-2xl shadow-2xl md:flex-row md:space-y-0 md:space-x-10 md:m-0 md:p-16">
            <div>
                
                <img src="./images/headphone.png" alt="Headphone" class="mx-auto hover:scale-105 duration-300 w-60">
            </div>
<!--            content-->
       <div class="flex flex-col space-y-6">
          <div>
           <div class="flex flex-col mb-4 space-y-3 text-center md:text-left">
               <div class = "inline-block px-3 py-1 text-sm text-white bg-black rounded-full text-center w-40">Free Shipping</div>
           </div>
           </div>
           
           <div class="max-w-sm text-2xl font-medium">
               Razer Kraken Kitty Edt Gaming Headset Quartz
           </div>
<!--           Price container -->
      <div class="flex flex-col mb-4 space-y-3 text-center md:text-left">
          <p class = "line-through">$799</p>
          <p class = "text-5xl font-bold">$599</p>
          
          <p class = "text-sm font-light texd-gray-400">This offer is valid until April 3rd or as long as stock lasts.</p>
      </div>
      
      <div class = "group">
          <button class = "w-full bg-blue-700 text-white border-b-8 border-b-blue-700 rounded-lg group-hover:border-t-8 group-hover:border-b-0 group-hover:bg-blue-700 group-hover:border-t-blue-700 group-hover:shadow-lg transition-all duration-200">
              <div class = "px-8 py-4 bg-blue-500 rounded-lg group-hover:bg-blue-700 duration-200">
                  Add to cart
              </div>
          </button>
      </div>
      
      <div class = "flex items-cetner space-x-3 group">
          <div class = "w-3 h-3 bg-green-400 rounded-full group-hover:animate-ping"></div>
          <div class = "text-sm pt-[-10px]">
              50+ pcs. in stock.
          </div>
      </div>
      
      <div class="flex flex-col space-y-4 md:space-y-0 md:space-x-4 md:flex-row">
          <button class = "flex items-center justify-center py-3 px-5 gap-4 border-4 border-gray-340 rounded-lg hover:bg-opacity-30 hover:-translate-y-1 transition-all duration-200">
              <img src="./images/weight.png" alt="" class = "w-8">
              <span>Add to cart</span>
          </button>
          
          <button class = "flex items-center justify-center py-3 px-5 gap-4 border-4 border-gray-340 rounded-lg hover:opacity-30 hover:-translate-y-1 transition-all duration-200">
              <img src="./images/heart.png" alt="" class = "w-8">
              <span>Add to wishlist</span>
          </button>
      </div>
      
       </div>
        </div>
    </div>
</body>
</html>
