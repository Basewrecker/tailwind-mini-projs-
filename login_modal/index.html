<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&family=Rokkitt:wght@600;700&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Mulish', 'sans-serif'],
                    mono: ['Rokkitt', 'monospace'],
                }
            }
        }

    </script>
</head>

<body>
    <!--Global container     -->
    <div class="flex items-center justify-center min-h-screen bg-rose-50">
        <!--        Card container     -->
        <div class="relative flex flex-col m-6 space-y-10 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0 md:m-0">
            <!--       Left Side     -->
            <div class="p-6 md:p-20">
                <h2 class="font-mono mb-5 text-4xl font-bold">
                    Login
                </h2>
                <p class="max-w-sm mb-12 font-sans font-light text-gray-600">
                    Log in to your account to upload or download pictures, videos or music.
                </p>
                <input type="text" placeholder="Enter your email address" class="w-full p-6 border border-gray-300 rounded-md placeholder:font-sans placeholder:font-light">

                <div class="flex flex-col items-center justify-between mt-6 space-y-6 md:flex-row md:space-y-0">
                    <div class="font-thin text-cyan-700">
                        Forgot password?
                    </div>
                    <button class = "w-40 md:width-auto flex justify-center items-center p-6 space-x-4 font-sans font-bold text-white rounded-md shadow-lg px-9 bg-cyan-700 shadow-cyan-100 hover:bg-opacity-90 shadow:sm hover:shadow-lg border transition hover:-translate-y-1 duration-200">
                        <span>Next    --></span>
                    </button>
                </div>
                
                <div class = "mt-12 border-b border-b-gray-300"></div>
                <p class = "text-center pt-6 font-thin text-gray-400">Or log in with</p>
                
                
                <div class="flex flex-col items-center justify-center mt-12 space-y-4 md:flex-row md:space-y-0 md:space-x-4 md:items-stretch">
                   
                    <button class = "flex items-center justify-center gap-3 w-full md:w-auto border border-gray-300 px-8 py-3 rounded-md transition-all duration-200 hover:border-gray-400 hover:shadow-md hover:bg-gray-50 hover:-translate-y-0.5">
                        <img src="./images/facebook.png" alt="Facebook" class = "w-5 h-5">
                        <span class = "font-thin">Facebook</span>
                    </button>
                    
                    <button class = "flex items-center justify-center gap-3 w-full md:w-auto border border-gray-300 px-8 py-3 rounded-md transition-all duration-200 hover:border-gray-400 hover:shadow-md hover:bg-gray-50 hover:-translate-y-0.5">
                        <img src="./images/google.png" alt="Google" class = "w-5 h-5">
                        <span class = "font-thin">Google</span>
                    </button>
                </div>
                
            </div>

            <!--       Right Side     -->
            <img src="./images/image.jpg" alt="" class="w-[430px] hidden md:block">
        </div>
    </div>
</body>

</html>
