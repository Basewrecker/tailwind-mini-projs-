<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Email Subscribe</title>
</head>

<body>
    <!-- Background Container -->
    <div class="flex items-center justify-center min-h-screen bg-zinc-700">

        <!-- Card -->
        <div class="bg-zinc-800 p-2 mx-6 rounded-2xl">

            <!-- Flex Container -->
            <div class="flex flex-col md:flex-row overflow-hidden rounded-xl">

                <!-- Image -->
                <img src="images/image.jpg" alt="Diet and fitness" class="object-cover h-80 md:h-64 md:w-64 transform hover:scale-105 duration-200" />

                <!-- Content -->
                <div class="p-6 md:p-12 flex flex-col justify-center">
                    <h2 class="font-serif text-xl font-medium text-center text-white md:text-left">
                        Get diet and fitness tips in your inbox
                    </h2>

                    <p class="max-w-xs my-4 text-xs leading-5 tracking-wide text-center text-zinc-300 md:text-left">
                        Eat better and exercise better. Sign up for the Diet & Fitness newsletter.
                    </p>
                </div>
                <div class="flex flex-col mt-5 space-y-4 md:flex-row md:space-y-0 md:space-x-3">

                    <input type="email" placeholder="Enter your email address" class="flex-1 p-3 px-4 text-white rounded-md bg-zinc-800 border border-zinc-600
           placeholder:text-zinc-400 placeholder:text-center md:placeholder:text-left
           focus:outline-none" />

                    <button class="px-6 py-3 text-xs font-semibold rounded-md
           text-zinc-900 bg-lime-500 hover:bg-lime-600 hover:text-white duration-500">
                        Subscribe
                    </button>

                </div>


            </div>
        </div>
    </div>
</body>

</html>
